server {
    listen 80;
    # Tunnel hiện tại trên Cloudflare trỏ origin đến localhost:3000.
    # cloudflared dùng chung network namespace với container Frontend.
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Luôn kiểm tra lại HTML và CSS sau khi triển khai để tránh ghép WASM mới
    # với stylesheet CSS isolation cũ còn nằm trong cache trình duyệt.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    location = /appsettings.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location ~* \.css$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://api-gateway:8080/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /_framework/ {
        try_files $uri =404;
    }
}
