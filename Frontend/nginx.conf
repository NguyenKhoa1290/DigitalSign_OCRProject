server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Luôn kiểm tra lại HTML và CSS sau khi triển khai để tránh ghép WASM mới
    # với stylesheet CSS isolation cũ còn nằm trong cache trình duyệt.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    location ~* \.css$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /_framework/ {
        try_files $uri =404;
    }
}
