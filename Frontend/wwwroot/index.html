<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Hệ thống quản lý công văn HAU" />
    <title>HAU - Hệ thống Quản lý Công văn</title>
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="HauDocumentApp.styles.css" rel="stylesheet" />
</head>
<body>
    <div id="app">
        <div class="app-loading">
            <div class="loading-logo">
                <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="48" height="48" rx="12" fill="#3b82f6" />
                    <path d="M12 14h24M12 20h16M12 26h20M12 32h12" stroke="white" stroke-width="2.5" stroke-linecap="round" />
                </svg>
                <span>HAU Documents</span>
            </div>
            <div class="loading-spinner-ring"></div>
            <p class="loading-text">Đang tải hệ thống...</p>
        </div>
    </div>
    <div id="blazor-error-ui">
        <div class="error-content">
            <span>Đã xảy ra lỗi không mong đợi.</span>
            <a href="." class="reload">Tải lại</a>
            <span class="dismiss">✕</span>
        </div>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
