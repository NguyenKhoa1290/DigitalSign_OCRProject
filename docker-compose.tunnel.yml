services:
  frontend:
    environment:
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-https://hauquanlycongvan.com/}

  cloudflared:
    image: cloudflare/cloudflared:latest
    # TCP transport avoids the intermittent QUIC/UDP timeouts observed on this host.
    command: tunnel --no-autoupdate --protocol http2 run
    env_file:
      - .env.tunnel
    depends_on:
      frontend:
        condition: service_started
        restart: true
      api-gateway:
        condition: service_started
    restart: unless-stopped
